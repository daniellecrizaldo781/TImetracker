<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Time Tracker — Admin Dashboard</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="demoBanner" class="demo-banner" hidden></div>

<!-- Supabase auth overlay -->
<div id="authOverlay" class="auth-overlay" style="display:none">
  <div class="auth-card">
    <div class="auth-title">⏱ Admin Dashboard</div>
    <div class="auth-sub">Sign in with your approved email</div>
    <input id="authEmail" type="email" placeholder="you@oricle.com" autocomplete="email" />
    <input id="authPass" type="password" placeholder="Password" autocomplete="current-password" />
    <button id="authSend">Sign in</button>
    <div class="auth-divider"><span>or</span></div>
    <button id="demoAdmin" class="auth-reset" style="font-size:14px;padding:8px;margin-top:2px">▶ Try Admin Demo (no login)</button>
    <button id="authReset" class="auth-reset">Forgot password?</button>
    <div id="authMsg" class="auth-msg"></div>
    <!-- password recovery (shown when the email magic link lands here) -->
    <div id="recoveryBox" style="display:none">
      <div class="auth-sub" style="margin-top:8px">Set a new password</div>
      <input id="recoveryPass" type="password" placeholder="New password" autocomplete="new-password" />
      <button id="recoverySave">Update password</button>
    </div>
  </div>
</div>

<!-- Dashboard (hubstaff-inspired, sidebar) -->
<div id="dashView" class="view hidden">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">⏱ <b>Time Tracker</b></div>
      <nav class="sidebar-nav" id="sideNav">
        <a class="nav-item" data-page="overview" style="font-weight:700">📊 Overview</a>
        <a class="nav-item" data-page="timesheets">🕒 Timesheets</a>
        <a class="nav-item" data-page="activity">📈 Activity</a>
        <a class="nav-item" data-page="breaks">☕ Break Monitoring</a>
        <a class="nav-item" data-page="schedule">🗓 Schedule &amp; Attendance</a>
        <a class="nav-item" data-page="reports">📄 Reports</a>
        <a class="nav-item" data-page="payroll">💰 Payroll Reports</a>
        <a class="nav-item" data-page="employees">👥 Employees</a>
        <a class="nav-item" data-page="teams">🗂 Teams</a>
        <a class="nav-item" data-page="projects">🏗 Projects &amp; Tasks</a>
        <a class="nav-item" data-page="settings">⚙️ Settings</a>
      </nav>
      <div class="sidebar-footer">
        <button class="btn ghost block" id="logoutBtn">Logout</button>
      </div>
    </aside>

    <main class="main">
      <header class="main-head">
        <h1 id="pageTitle">Overview</h1>
        <div class="head-filters" id="headFilters"></div>
      </header>
      <div class="page-body" id="pageBody"></div>
    </main>
  </div>
</div>

<!-- Global error catch: surface any uncaught error visibly so a "glitch" isn't silent -->
<script>
  window.addEventListener('error', function (ev) {
    var msg = ev && ev.error ? (ev.error.message || String(ev.error)) : (ev.message || 'error');
    var box = document.getElementById('errBanner');
    if (!box) {
      box = document.createElement('div');
      box.id = 'errBanner';
      box.style.cssText = 'position:fixed;bottom:8px;left:8px;right:8px;z-index:99999;background:#2a0d0d;color:#ffb4b4;border:1px solid #ff5c5c;padding:10px 14px;font:12px monospace;white-space:pre-wrap;max-height:140px;overflow:auto;border-radius:8px';
      box.textContent = '[error] ' + msg;
      document.body.appendChild(box);
    } else {
      box.textContent = '[error] ' + msg;
    }
  }, true);
</script>
<script src="js/config.js?v=5b02534"></script>
<script src="js/util.js?v=5b02534"></script>
<script src="js/store.js?v=5b02534"></script>
<script src="js/api.js?v=5b02534"></script>
<script src="assets/supabase.js?v=5b02534"></script>
<script src="js/auth.js?v=5b02534"></script>
<script src="js/live.js?v=5b02534"></script>
<script src="js/admin.js?v=5b02534"></script>
</body>
</html>
