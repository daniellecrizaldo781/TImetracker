<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Time Tracker — Employee</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="employee-bg">
<div id="demoBanner" class="demo-banner" hidden></div>

<!-- Supabase auth overlay (same login as Team Dashboard) -->
<div id="authOverlay" class="auth-overlay" style="display:none">
  <div class="auth-card">
    <div class="auth-title">⏱ Time Tracker</div>
    <div class="auth-sub">Sign in with your approved email</div>
    <input id="authEmail" type="email" placeholder="you@oricle.com" autocomplete="email" />
    <input id="authPass" type="password" placeholder="Password" autocomplete="current-password" />
    <button id="authSend">Sign in</button>
    <div class="auth-divider"><span>or</span></div>
    <button id="demoEmp" class="auth-reset" style="font-size:14px;padding:8px;margin-top:2px">▶ Try Employee Demo (no login)</button>
    <button id="authReset" class="auth-reset">Forgot password?</button>
    <div id="authMsg" class="auth-msg"></div>
    <!-- password recovery (shown when the email magic link lands here) -->
    <div id="recoveryBox" style="display:none">
      <div class="auth-sub" style="margin-top:8px">Set a new password</div>
      <input id="recoveryPass" type="password" placeholder="New password" autocomplete="new-password" />
      <button id="recoverySave">Update password</button>
    </div>
  </div>
</div>

<!-- Login (shown only if Supabase is NOT configured) -->
<div id="loginView" class="view hidden">
  <div class="card login-card">
    <h1 class="brand">⏱ <span id="brandName">Time Tracker</span></h1>
    <p class="sub">Sign in to start tracking.</p>
    <label>Email
      <input type="email" id="loginEmail" placeholder="you@oricle.com" autocomplete="username" />
    </label>
    <label>PIN
      <input type="password" id="loginPin" placeholder="Your 4-digit PIN" autocomplete="current-password" />
    </label>
    <p id="loginMsg" class="msg error" hidden></p>
    <button class="btn primary block" id="loginBtn">Sign In</button>
    <p class="hint">Demo login: <code>demo@oricle.local</code> / <code>1234</code></p>
  </div>
</div>

<!-- Tracker -->
<div id="trackerView" class="view hidden">
  <header class="tracker-header">
    <span class="logo">⏱ <span id="trackerBrand">Time Tracker</span></span>
    <div class="header-right">
      <span id="userEmail" class="pill"></span>
      <span id="statusPill" class="pill">Offline</span>
      <button class="btn ghost" id="logoutBtn">Logout</button>
    </div>
  </header>

  <main class="tracker-main">
    <!-- Hero timer -->
    <section class="card hero-card">
      <div class="timer-display" id="elapsedDisplay">00:00:00</div>
      <div class="timer-labels">
        <span id="liveActivity" class="stat-inline">Activity: <b>—</b></span>
        <span id="todayTotal" class="stat-inline">Today: <b>—</b></span>
        <span id="idleStatus" class="stat-inline">—</span>
      </div>

      <div class="controls">
        <select id="projectSelect" class="select"><option>Select project…</option></select>
        <select id="taskSelect" class="select"><option>Select task…</option></select>
        <div class="btn-row">
          <button class="btn primary" id="startBtn">▶ Start</button>
          <button class="btn warn" id="pauseBtn" hidden>⏸ Break</button>
          <button class="btn accent" id="resumeBtn" hidden>▶ Resume</button>
          <button class="btn danger" id="stopBtn" hidden>■ Stop</button>
        </div>
      </div>
      <p id="trackerMsg" class="msg" hidden></p>
    </section>

    <!-- Break management -->
    <section class="card break-card" id="breakCard" hidden>
      <h3>Break</h3>
      <div class="break-picker" id="breakPicker">
        <button class="btn break-opt" data-break="first">First Break · 15m</button>
        <button class="btn break-opt" data-break="second">Second Break · 15m</button>
        <button class="btn break-opt" data-break="restroom">Restroom · 5m</button>
        <button class="btn break-opt" data-break="lunch">Lunch · 60m</button>
      </div>
      <div id="breakStatus" class="break-status" hidden></div>
      <div id="breakCountdown" class="break-countdown" hidden></div>
      <div id="breakRemaining" class="break-remaining muted"></div>
    </section>
  </main>
</div>

<!-- Global error catch: surface any uncaught error visibly so a "glitch" isn't silent -->
<script>
  window.addEventListener('error', function (ev) {
    var msg = ev && ev.error ? (ev.error.message || String(ev.error)) : (ev.message || 'error');
    var box = document.getElementById('errBanner');
    if (!box) {
      box = document.createElement('div');
      box.id = 'errBanner';
      box.style.cssText = 'position:fixed;bottom:8px;left:8px;right:8px;z-index:99999;background:#2a0d0d;color:#ffb4b4;border:1px solid #ff5c5c;padding:10px 14px;font:12px monospace;white-space:pre-wrap;max-height:140px;overflow:auto;border-radius:8px';
      box.textContent = '[error] ' + msg;
      document.body.appendChild(box);
    } else {
      box.textContent = '[error] ' + msg;
    }
  }, true);
</script>
<script src="js/config.js?v=5b02533"></script>
<script src="js/util.js?v=5b02533"></script>
<script src="js/store.js?v=5b02533"></script>
<script src="js/api.js?v=5b02533"></script>
<script src="assets/supabase.js?v=5b02533"></script>
<script src="js/auth.js?v=5b02533"></script>
<script src="js/live.js?v=5b02533"></script>
<script src="js/activity.js?v=5b02533"></script>
<script src="js/employee.js?v=5b02533"></script>
</body>
</html>
